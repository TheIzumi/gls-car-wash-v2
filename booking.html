<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLS Car Wash Booking</title>

    css/main.css
    css/booking.css
</head>
<body>

    <div class="booking-container">

        assets/logo.png

        <h1>Book Car Wash</h1>
        <p>Register your vehicle and select your wash package.</p>

        <form id="booking-form">

            <label>Phone Number *</label>
            <input type="tel" id="phoneNumber" required>

            <label>Plate Number *</label>
            <input type="text" id="plateNumber" required>

            <label>Customer Name</label>
            <input type="text" id="customerName">

            <label>Vehicle Type</label>
            <select id="vehicleType" required>
                <option value="">Select Vehicle</option>
                <option value="Small Car">Small Car</option>
                <option value="Sedan">Sedan</option>
                <option value="SUV">SUV</option>
                <option value="MPV">MPV</option>
                <option value="Van">Van</option>
            </select>

            <label>Wash Type</label>
            <select id="washType" required>
                <option value="">Select Wash Type</option>
                <option value="Normal Wash">Normal Wash</option>
                <option value="Nano Wash">Nano Wash</option>
            </select>

            <label>Booking Type</label>
            <select id="bookingType">
                <option value="Walk-In">Walk-In</option>
                <option value="Future Booking">Future Booking</option>
            </select>

            <div class="total-box">
                <h2>Total Amount</h2>
                <div id="totalAmount">RM 0.00</div>
            </div>

            <button type="submit">
                Continue
            </button>

        </form>

    </div>

    js/booking.jsscript>

</body>
</html>
